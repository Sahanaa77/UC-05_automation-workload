name: CI — WorkloadLens

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Backend — lint, type check, unit + integration tests
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies (including dev extras)
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest tests/ -q --tb=short

  # ---------------------------------------------------------------------------
  # Job 2: Frontend — TypeScript check + Vite build
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend build (Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Vite production build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Job 3: Terraform — fmt + validate (no credentials, no plan/apply)
  # ---------------------------------------------------------------------------
  terraform-validate:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: terraform fmt -check
        run: terraform fmt -check infra/

      - name: terraform init (local backend, no Azure credentials needed for validate)
        run: terraform -chdir=infra init -input=false -backend=false

      - name: terraform validate
        run: terraform -chdir=infra validate

  # ---------------------------------------------------------------------------
  # Job 4: Build and push Docker image to Azure Container Registry
  #
  # Prerequisites (repository secrets required):
  #   ACR_LOGIN_SERVER  — e.g. myacr.azurecr.io
  #   ACR_USERNAME      — service principal / admin username
  #   ACR_PASSWORD      — service principal / admin password  (mark as secret)
  #
  # This job only runs on push to main or a release tag, not on pull requests,
  # to avoid exposing secrets to untrusted code.
  #
  # The image tag uses the Git SHA so every push produces a unique, traceable
  # image. The 'latest' tag is also pushed for convenience.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & push image to ACR
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, terraform-validate]
    # Run on pushes to main and the active feature branch.
    # Skipped on pull_request events (untrusted code must not access secrets).
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/uc05-infra-docs')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Dockerfile exists
        run: |
          if [ ! -f backend/Dockerfile ]; then
            echo "ERROR: backend/Dockerfile not found" >&2
            exit 1
          fi
          echo "backend/Dockerfile found"

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/workloadlens:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/workloadlens:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Confirm image digest
        run: |
          echo "Image pushed successfully."
          echo "Tag: ${{ secrets.ACR_LOGIN_SERVER }}/workloadlens:${{ github.sha }}"
          echo "This digest must be used in dev.tfvars / prod.tfvars before running deploy.sh"
